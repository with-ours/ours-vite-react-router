name: Dependabot auto-merge

# Turns Dependabot PRs into a one-click merge: you approve, GitHub merges.
#
# This deliberately does NOT approve. Every default branch here has a ruleset
# requiring one approving review, and that review stays a human decision — a
# bot that both authors and approves a dependency bump is not a review. All
# this removes is the second visit to click "Squash and merge".
#
# Auto-merge waits only on REQUIRED checks. In repos whose ruleset has no
# required_status_checks, an approval merges immediately even if CI is still
# running — promote the checks to required if you want them to gate.
#
# Dependabot-triggered runs get a read-only GITHUB_TOKEN by default; the
# permissions block below is what lets `--auto` work without a PAT or App token.
# Uses no third-party actions, so there is nothing here to SHA-pin.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
